name: examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [greet, serve, site]
    steps:
      - uses: actions/checkout@v4
      - name: Read the Knave version from project.knv
        run: |
          versions=$(awk '{ out = ""; for (i = 1; i <= length($0); i++) { c = substr($0, i, 1); if (escaped) escaped = 0; else if (quoted && c == "\\") escaped = 1; else if (c == "\"") quoted = !quoted; else if (!quoted && c == ";") break; out = out c } print out }' project.knv | grep -o ':knave "[^"]*"' | cut -d '"' -f 2 || true)
          test -n "$versions" || { echo "::error file=project.knv::project.knv records no :knave \"x.y.z\" on one line"; exit 1; }
          test "$(echo "$versions" | wc -l)" -eq 1 || { echo "::error file=project.knv::project.knv records more than one :knave version"; exit 1; }
          echo "KNAVE_VERSION=$versions" >> "$GITHUB_ENV"
      - id: knave-cache
        uses: actions/cache/restore@v4
        with:
          path: &knave-files |
            ~/.cargo/bin/knave
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: knave-${{ env.KNAVE_VERSION }}-${{ runner.os }}
      - name: Install Knave
        run: cargo install knave --version "$KNAVE_VERSION" --locked
      - if: steps.knave-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *knave-files
          key: ${{ steps.knave-cache.outputs.cache-primary-key }}
      - name: Check the example
        working-directory: examples/${{ matrix.example }}
        run: knave check
      - name: Check the layout
        working-directory: examples/${{ matrix.example }}
        run: knave fmt --check
      - name: Lint
        working-directory: examples/${{ matrix.example }}
        run: knave lint
      - name: Print the help
        working-directory: examples/${{ matrix.example }}
        run: knave run -- --help
      - name: Print the completion script
        working-directory: examples/${{ matrix.example }}
        run: COMPLETE=bash knave run
