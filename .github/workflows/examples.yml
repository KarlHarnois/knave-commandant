name: examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [greet, serve, site]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-knave
      - name: Check the example
        working-directory: examples/${{ matrix.example }}
        run: knave check
      - name: Check the layout
        working-directory: examples/${{ matrix.example }}
        run: knave fmt --check
      - name: Lint
        working-directory: examples/${{ matrix.example }}
        run: knave lint
      - name: Print the help
        working-directory: examples/${{ matrix.example }}
        run: knave run -- --help
      - name: Print the completion script
        working-directory: examples/${{ matrix.example }}
        run: COMPLETE=bash knave run
      - name: Refuse a bad option
        working-directory: examples/${{ matrix.example }}
        run: |
          status=0
          output=$(knave run -- --no-such-option 2>/dev/null) || status=$?
          test "$status" -eq 2 || { echo "::error::a bad option exited with $status, not 2"; exit 1; }
          test -z "$output" || { echo "::error::a bad option printed on stdout"; exit 1; }
