name: file-lengths

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  file-lengths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-knave
      - name: Keep each source file under 150 lines
        run: knave task check-file-lengths
