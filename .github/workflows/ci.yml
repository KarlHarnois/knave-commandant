name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Knave version from project.knv
        run: |
          uncommented=$(awk '
            BEGIN {
              in_string = 0
              after_backslash = 0
            }
            {
              kept = ""
              for (i = 1; i <= length($0); i++) {
                character = substr($0, i, 1)
                if (after_backslash) after_backslash = 0
                else if (in_string && character == "\\") after_backslash = 1
                else if (character == "\"") in_string = !in_string
                else if (!in_string && character == ";") break
                kept = kept character
              }
              print kept
            }
          ' project.knv || true)
          versions=$(printf '%s\n' "$uncommented" | grep -o ':knave "[^"]*"' | cut -d '"' -f 2 || true)
          test -n "$versions" || { echo "::error file=project.knv::project.knv records no :knave \"x.y.z\" on one line"; exit 1; }
          test "$(echo "$versions" | wc -l)" -eq 1 || { echo "::error file=project.knv::project.knv records more than one :knave version"; exit 1; }
          echo "KNAVE_VERSION=$versions" >> "$GITHUB_ENV"
      - id: knave-cache
        uses: actions/cache/restore@v4
        with:
          path: &knave-files |
            ~/.cargo/bin/knave
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: knave-${{ env.KNAVE_VERSION }}-${{ runner.os }}
      - name: Install Knave
        run: cargo install knave --version "$KNAVE_VERSION" --locked
      - if: steps.knave-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *knave-files
          key: ${{ steps.knave-cache.outputs.cache-primary-key }}
      - name: Check the layout
        run: knave fmt --check
      - name: Lint
        run: knave lint
      - name: Test
        run: knave test
